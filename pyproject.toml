[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonmap"
version = "0.1.0"
description = "把带 GPS 信息的照片在 Google Earth / Google Maps / 百度地图等平台上可视化"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "piexif>=1.1.3"]
# 可选：用视觉模型猜地名（AI 辅助定位）。核心功能不需要它。
ai = ["anthropic>=0.40"]
# 可选：打包单文件 exe 用（.\build_exe.ps1）
build = ["pyinstaller>=6.22"]

[project.scripts]
photonmap = "photonmap.cli:main"
photonmap-gui = "photonmap.launcher:main"

[tool.setuptools.packages.find]
include = ["photonmap*"]

[tool.setuptools.package-data]
photonmap = [
    "templates/*.html",
    "templates/*.js",
    "templates/*.css",
    "templates/vendor/*",
    "templates/vendor/images/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
